name: check

on:
  push:
  pull_request:

# Read-only token: the job only checks out the code and runs the checks.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git bash on windows-latest: one script (scripts/check.sh) for every OS
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        name: System packages the program uses
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pyfuse3 python3-trio python3-venv ffmpeg
      # macOS and Windows: no pyfuse3/trio (core only, see #7/#103), no FUSE and
      # no disc, but the unit tests still probe a real ffprobe (test_dvd_reader.py)
      - if: runner.os == 'macOS'
        name: ffmpeg
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        name: ffmpeg
        run: choco install ffmpeg --no-progress -y
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff, pyright, shellcheck, tests
        run: scripts/check.sh
