name: Debian package

on:
  release:
    types: [published]
  workflow_dispatch:
  # changes to what goes into the package: build and install-test, never publish
  pull_request:
    paths:
      - src/**
      - scripts/build-deb.sh
      - scripts/deb-*
      - .github/workflows/deb.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git lintian
      - name: Build package
        run: scripts/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bluray3d-xr-deb
          path: dist/*.deb
          if-no-files-found: error

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: [debian:trixie, ubuntu:24.04]
        recommends: [recommends, no-recommends]
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bluray3d-xr-deb
          path: dist
      - name: Install, verify, remove
        run: bash scripts/deb-install-test.sh dist/*.deb ${{ matrix.recommends }}

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bluray3d-xr-deb
          path: dist
      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"
