# DLNA and Samba together (SHARE=both). SSDP discovery is multicast, which
# Docker's bridge network does not carry to the LAN: this runs on the host
# network instead, keeping what Samba and FUSE need (/dev/fuse, SYS_ADMIN).
# Samba then listens on the host's own port 445 (SMB_PORT does not apply) and
# the DLNA server on HTTP_PORT. Start with:
#   docker compose -f docker-compose.yml -f docker-compose.both.yml up -d --build
services:
  bd3d:
    network_mode: host
    ports: !reset []
    # the DLNA device id comes from the machine id: the host's, so it survives
    # recreating the container (renderers would otherwise see a new server)
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
    environment:
      SHARE: both
