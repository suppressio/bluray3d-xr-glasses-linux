# Settings go in .env (copy .env.example). Start with: docker compose up -d --build
services:
  bd3d:
    build: .
    image: bluray3d-xr:local
    container_name: bluray3d-xr
    ports:
      # SMB. The host must not run its own Samba on 445 at the same time.
      - "${SMB_PORT:-445}:445"
      # DLNA/UPnP needs the host network (SSDP discovery is multicast, which this
      # bridge network does not carry): add docker-compose.dlna.yml (DLNA only,
      # no Samba/FUSE) or docker-compose.both.yml (DLNA and Samba) on top of this file
    volumes:
      - "${MOVIES_DIR:?set MOVIES_DIR in .env}:/films:ro"
      # key database for libaacs (commercial discs); not provided by this project
      - "${AACS_DIR:-./aacs}:/root/.config/aacs:ro"
      # BD+ discs: libbdplus configuration (vm0/) and conversion tables (convtab/)
      - "${BDPLUS_DIR:-./bdplus}:/root/.config/bdplus:ro"
      # encrypted DVDs (CSS) need libdvdcss, not in the image: uncomment to use the host's
      # - /usr/lib/x86_64-linux-gnu/libdvdcss.so.2:/usr/lib/x86_64-linux-gnu/libdvdcss.so.2:ro
      # --lookup's local cache, kept across container recreations (LOOKUP=on only)
      - "${LOOKUP_CACHE_DIR:-./lookup-cache}:/root/.cache/bluray3d-xr"
    environment:
      DRIVE: "${DRIVE:-}"
      AUDIO_LANG: "${AUDIO_LANG:-}"
      AUDIO_FILES: "${AUDIO_FILES:-per-language}"
      LIGHT: "${LIGHT:-on}"
      SUBS: "${SUBS:-all}"
      SUB_DEPTH: "${SUB_DEPTH:-8}"
      LOADER: "${LOADER:-retrowave}"
      ENCODER: "${ENCODER:-auto}"
      SHARE: "${SHARE:-samba}"
      HTTP_PORT: "${HTTP_PORT:-8200}"
      LOOKUP: "${LOOKUP:-off}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
    # FUSE inside the container needs the device and SYS_ADMIN
    devices:
      - /dev/fuse
      # Blu-ray drive: uncomment and set DRIVE=/dev/sr0 in .env
      # - /dev/sr0
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: "no"
