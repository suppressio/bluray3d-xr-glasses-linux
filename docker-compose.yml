# Settings go in .env (copy .env.example). Start with: docker compose up -d --build
services:
  bd3d:
    build: .
    image: bluray3d-xr:local
    container_name: bluray3d-xr
    ports:
      # SMB. The host must not run its own Samba on 445 at the same time.
      - "${SMB_PORT:-445}:445"
    volumes:
      - "${MOVIES_DIR:?set MOVIES_DIR in .env}:/films:ro"
      # key database for libaacs (commercial discs); not provided by this project
      - "${AACS_DIR:-./aacs}:/root/.config/aacs:ro"
    environment:
      DRIVE: "${DRIVE:-}"
      AUDIO_LANG: "${AUDIO_LANG:-}"
      AUDIO_FILES: "${AUDIO_FILES:-per-language}"
      LIGHT: "${LIGHT:-on}"
      ENCODER: "${ENCODER:-auto}"
    # FUSE inside the container needs the device and SYS_ADMIN
    devices:
      - /dev/fuse
      # Blu-ray drive: uncomment and set DRIVE=/dev/sr0 in .env
      # - /dev/sr0
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: "no"
