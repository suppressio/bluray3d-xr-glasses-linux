# Minimal Samba config: one read-only guest share with the virtual 3D files.
[global]
   server role = standalone server
   map to guest = bad user
   server min protocol = SMB2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   logging = file

[3D]
   path = /srv/bd3d
   comment = 3D Blu-ray, SBS on the fly
   read only = yes
   guest ok = yes
   browseable = yes
